version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.10
    commands:
      - echo Installing dependencies...
      - pip install -r requirements.txt
      - echo Dependencies installed.

  build:
    commands:
      - echo Running tests...
      - pytest --html=report.html --self-contained-html

artifacts:
  files:
    - report.html
 